<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Screen AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; }
        model-viewer { width: 100vw; height: 100vh; }
        .btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-weight: bold; z-index: 10; }
    </style>
</head>
<body>

    <model-viewer 
        id="viewer"
        ar ar-modes="webxr scene-viewer quick-look" 
        ar-placement="wall" 
        camera-controls 
        poster="https://drive.google.com/uc?export=download&id=1TIpDe-sh__Thaj1Kx8qKPTSrG9TKT361">
        
        <button slot="ar-button" class="btn">عرض الشاشة على الجدار 📱</button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');
        const videoUrl = "https://drive.google.com/uc?export=download&id=1jmR2NyNPdAfhiMNpLB92QJJy8l3lS4Ow";
        
        // بمجرد دخول العميل لوضع الـ AR، سنقوم بتبديل المحتوى بالفيديو
        viewer.addEventListener('ar-status', (event) => {
            if(event.detail.status === 'object-placed') {
                console.log("تم وضع الشاشة على الجدار بنجاح");
            }
        });
    </script>
</body>
</html>
