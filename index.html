<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR System</title>
    <!-- استخدام روابط CDN مستقرة جداً -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* التوسط المطلق للأزرار والهوية */
        .ui-fixed { position: fixed; left: 0; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none; }
        .header { top: 20px; }
        .controls { bottom: 50px; pointer-events: auto; gap: 10px; }
        .label { background: white; padding: 10px 20px; border-radius: 8px; color: #1a73e8; font-weight: bold; }
        button { padding: 15px 25px; border-radius: 5px; border: none; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>
    <div class="ui-fixed header"><div class="label">SATTEC</div></div>
    
    <div class="ui-fixed controls">
        <button id="btnPlay">تشغيل الفيديو ▶️</button>
        <button id="btnMute">كتم/فتح الصوت 🔊</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- الملفات من المستودع الموضح في image_d3d832.png -->
            <video id="v" src="screen_video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="f" src="frame.png">
        </a-assets>

        <!-- الربط بالباترن sattec-logo.patt الموضح في image_d3d832.png -->
        <a-marker type="pattern" url="sattec-logo.patt">
            <a-entity rotation="-90 0 0">
                <a-image src="#f" width="2.4" height="1.4"></a-image>
                <a-plane material="src: #v; shader: flat;" width="2.2" height="1.2" position="0 0 0.05"></a-plane>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#v');
        const bPlay = document.querySelector('#btnPlay');
        const bMute = document.querySelector('#btnMute');

        // أهم وظيفة: تفاعل المستخدم الصريح لفك حظر الفيديو والصوت
        bPlay.addEventListener('click', () => {
            if (video.paused) {
                video.play().then(() => {
                    bPlay.innerText = "إيقاف مؤقت ⏸️";
                }).catch(err => console.error("Error:", err));
            } else {
                video.pause();
                bPlay.innerText = "تشغيل الفيديو ▶️";
            }
        });

        bMute.addEventListener('click', () => {
            video.muted = !video.muted;
            bMute.innerText = video.muted ? "فتح الصوت 🔊" : "كتم الصوت 🔇";
        });

        // إجبار التحديث المستمر للصورة (Fix لصوت بدون صورة)
        function render() {
            const mesh = document.querySelector('a-plane').getObject3D('mesh');
            if (mesh && mesh.material.map) mesh.material.map.needsUpdate = true;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
