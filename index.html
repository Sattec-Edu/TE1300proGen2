<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR - Fixed Lens</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <a-marker preset="hiro">
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <a-video src="#vid" position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div style="position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 1000;">
        <button id="playBtn" style="padding: 15px 35px; border-radius: 50px; border: none; background: #1a73e8; color: white; font-weight: bold; font-size: 18px; cursor: pointer;">
            تشغيل العرض التفاعلي ▶️
        </button>
    </div>

    <script>
        // كود إضافي لإجبار الكاميرا على إلغاء الزوم
        window.addEventListener('load', function () {
            setTimeout(() => {
                const videoElement = document.querySelector('video');
                if (videoElement && videoElement.srcObject) {
                    const track = videoElement.srcObject.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    
                    // محاولة ضبط الزوم على أقل قيمة ممكنة (1)
                    if (capabilities.zoom) {
                        track.applyConstraints({
                            advanced: [{ zoom: capabilities.zoom.min || 1 }]
                        });
                    }
                }
            }, 3000); // ننتظر 3 ثوانٍ حتى تعمل الكاميرا بالكامل
        });

        const btn = document.getElementById('playBtn');
        const video = document.getElementById('vid');
        btn.addEventListener('click', () => {
            if (video.paused) { video.play(); btn.innerHTML = "إيقاف مؤقت ⏸️"; btn.style.background = "#d93025"; }
            else { video.pause(); btn.innerHTML = "تشغيل العرض التفاعلي ▶️"; btn.style.background = "#1a73e8"; }
        });
    </script>
</body>
</html>
