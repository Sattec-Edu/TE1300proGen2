<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .ui { position: fixed; left: 0; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none; }
        .header { top: 20px; }
        .controls { bottom: 80px; pointer-events: auto; }
        .tag { background: white; padding: 10px 25px; border-radius: 8px; color: #1a73e8; font-weight: bold; }
        button { padding: 15px 40px; border-radius: 50px; border: none; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="ui header"><div class="tag">SATTEC</div></div>
    <div class="ui controls"><button id="btn">بدء التجربة الآن 🚀</button></div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        <a-assets>
            <!-- تأكد من رفع هذه الملفات بنفس الأسماء في GitHub -->
            <img id="ani" src="screen_animation.webp">
            <audio id="snd" src="voiceover.mp3" preload="auto"></audio>
            <img id="frm" src="frame.png">
        </a-assets>

        <!-- استخدام الرابط الكامل للملف لضمان التحميل -->
        <a-marker type="pattern" url="https://zsuliman.github.io/ar_screen/sattec-logo.patt" id="mainMarker">
            <a-entity rotation="-90 0 0">
                <a-image src="#frm" width="2.4" height="1.4" position="0 0 0.01"></a-image>
                <a-plane material="src: #ani; shader: flat; transparent: true;" width="2.2" height="1.2" position="0 0 0.05"></a-plane>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.querySelector('#mainMarker');
        const audio = document.querySelector('#snd');
        const btn = document.querySelector('#btn');

        btn.onclick = () => {
            btn.style.display = 'none';
            // إجبار المتصفح على منح الإذن للصوت
            audio.play().then(() => { audio.pause(); audio.currentTime = 0; });
        };

        // فحص تقني: هل الكاميرا ترى الباركود؟
        marker.addEventListener('markerFound', () => {
            console.log("Marker S Found!");
            audio.play();
        });

        marker.addEventListener('markerLost', () => {
            audio.pause();
        });
    </script>
</body>
</html>
