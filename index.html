<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SATTEC | العرض التفاعلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            direction: rtl;
        }
        
        .brand {
            background: #1a73e8;
            color: white;
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        
        /* حاوية الشاشة (الإطار + الفيديو فوقه) */
        .screen-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            padding: 20px;
        }
        
        /* صورة الإطار (الخلفية) */
        .frame-bg {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* الفيديو موضوع فوق الإطار */
        .video-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 380px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            z-index: 2;
        }
        
        video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        
        /* الأزرار */
        .buttons {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8f9fa;
        }
        
        button {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        
        .btn-play { background: #1a73e8; color: white; }
        .btn-mute { background: #5f6368; color: white; }
        .btn-pdf { background: #34a853; color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        
        button:active { transform: scale(0.97); }
        
        .contact {
            background: white;
            padding: 15px;
            font-size: 13px;
            color: #555;
            text-align: center;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">SATTEC</div>
    
    <!-- الإطار والفيديو معاً -->
    <div class="screen-wrapper">
        <img class="frame-bg" src="frame.png" alt="إطار الشاشة">
        <div class="video-overlay">
            <video id="mainVideo" src="screen_video.mp4" loop playsinline preload="auto">
                متصفحك لا يدعم تشغيل الفيديو
            </video>
        </div>
    </div>
    
    <div class="buttons">
        <button id="playPauseBtn" class="btn-play">▶️ تشغيل الفيديو</button>
        <button id="muteBtn" class="btn-mute">🔊 كتم الصوت</button>
        <button id="pdfBtn" class="btn-pdf">📄 تحميل المواصفات التقنية (PDF)</button>
        <button id="whatsappBtn" class="btn-whatsapp">📞 تواصل مع المبيعات</button>
    </div>
    
    <div class="contact">
        📧 info@sattec.com.sa | 📞 الرقم الموحد: 920008934
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    let isPlaying = false;
    
    playPauseBtn.addEventListener('click', () => {
        if (isPlaying) {
            video.pause();
            playPauseBtn.innerHTML = '▶️ تشغيل الفيديو';
            playPauseBtn.style.background = '#1a73e8';
        } else {
            video.play();
            playPauseBtn.innerHTML = '⏸️ إيقاف الفيديو';
            playPauseBtn.style.background = '#d93025';
        }
        isPlaying = !isPlaying;
    });
    
    muteBtn.addEventListener('click', () => {
        if (video.muted) {
            video.muted = false;
            muteBtn.innerHTML = '🔇 كتم الصوت';
            muteBtn.style.background = '#5f6368';
        } else {
            video.muted = true;
            muteBtn.innerHTML = '🔊 تشغيل الصوت';
            muteBtn.style.background = '#34a853';
        }
    });
    
    pdfBtn.addEventListener('click', () => {
        window.open('https://drive.google.com/uc?export=download&id=1JTGLbFJGl6ufil4V8fuHp3Cv9lNJR0Ix', '_blank');
    });
    
    whatsappBtn.addEventListener('click', () => {
        window.open('https://wa.me/966509818728?text=أهلاً%20أود%20الاستفسار%20عن%20الشاشات%20التفاعلية', '_blank');
    });
    
    video.muted = true;
    video.play().catch(e => console.log('انتظر تفاعل المستخدم'));
</script>

</body>
</html>
