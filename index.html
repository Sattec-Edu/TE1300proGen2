<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR - Wide View</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <!-- إجبار الكاميرا على أبعاد صغيرة لكسر الزوم -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; 
              sourceWidth: 640; 
              sourceHeight: 480; 
              displayWidth: 640; 
              displayHeight: 480; 
              debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <!-- ملفاتك المرفوعة بنفس الأسماء -->
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <!-- التعرف على علامة Hiro -->
        <a-marker preset="hiro">
            <!-- عرض الإطار -->
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <!-- عرض الفيديو فوقه بمليمترات -->
            <a-video src="#vid" position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- زر تفاعلي لتشغيل العرض -->
    <div style="position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 1000;">
        <button id="playBtn" style="
            padding: 15px 35px; 
            border-radius: 50px; 
            border: none; 
            background: #1a73e8; 
            color: white; 
            font-weight: bold; 
            font-size: 18px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;">
            تشغيل العرض التفاعلي ▶️
        </button>
    </div>

    <script>
        const btn = document.getElementById('playBtn');
        const video = document.getElementById('vid');
        
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btn.innerHTML = "إيقاف مؤقت ⏸️";
                btn.style.background = "#d93025";
            } else {
                video.pause();
                btn.innerHTML = "تشغيل العرض التفاعلي ▶️";
                btn.style.background = "#1a73e8";
            }
        });
    </script>
</body>
</html>
