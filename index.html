<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #202124; display: flex; flex-direction: column; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
        .ar-button {
            background: #1a73e8; color: white; border: none; border-radius: 8px;
            padding: 15px 25px; position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="Project Name (1).glb" 
        ar ar-modes="webxr scene-viewer quick-look" 
        ar-placement="wall" 
        camera-controls 
        shadow-intensity="1">
        <button slot="ar-button" class="ar-button">اضغط لعرض الشاشة على الجدار 📱</button>
    </model-viewer>
</body>
</html>
