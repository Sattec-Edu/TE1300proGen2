<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR Dashboard</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* التوسط المطلق للهوية والمعلومات */
        .header-brand {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .header-box {
            background: #fff; padding: 10px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: bold; color: #1a73e8;
        }

        .footer-contact {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            padding: 15px 0; text-align: center; z-index: 2000; font-size: 13px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .ui-controls {
            position: fixed; bottom: 90px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 15px; z-index: 2100;
        }

        button {
            padding: 12px 28px; border-radius: 50px; border: none;
            color: #fff; font-weight: bold; cursor: pointer; font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); min-width: 110px;
        }
        #playBtn { background: #1a73e8; }
        #muteBtn { background: #5f6368; }
    </style>
</head>

<body>
    <div class="header-brand"><div class="header-box">SATTEC</div></div>

    <div class="footer-contact">
        <div>info@sattec.com</div>
        <div style="margin-top: 5px;">الرقم الموحد: 920000000</div>
    </div>

    <div class="ui-controls">
        <button id="playBtn">تشغيل ▶️</button>
        <button id="muteBtn">صوت 🔊</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        <a-assets>
            <!-- استخدام ملفاتك بروابط مباشرة لضمان التحميل -->
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frameImg" src="frame.png">
        </a-assets>

        <a-marker type="pattern" url="pattern-qr-code (3).patt">
            <!-- الإطار الأساسي -->
            <a-image src="#frameImg" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            
            <!-- الفيديو: استخدام كيان بدائي لضمان الرندر -->
            <a-plane position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2" 
                     material="src: #vid; shader: flat; side: double; transparent: true; opacity: 1;">
            </a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#vid');
        const playBtn = document.querySelector('#playBtn');
        const muteBtn = document.querySelector('#muteBtn');

        // إصلاح "الخامة" برمجياً لضمان ظهور الفيديو
        video.addEventListener('loadeddata', function() {
            console.log("Video data loaded");
        });

        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = "إيقاف ⏸️";
                playBtn.style.background = "#d93025";
            } else {
                video.pause();
                playBtn.innerHTML = "تشغيل ▶️";
                playBtn.style.background = "#1a73e8";
            }
        });

        muteBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteBtn.innerHTML = "كتم 🔇";
                muteBtn.style.background = "#5f6368";
            } else {
                video.muted = true;
                muteBtn.innerHTML = "صوت 🔊";
                muteBtn.style.background = "#34a853";
            }
        });

        // حركة "إيقاظ" الفيديو للأندرويد
        window.addEventListener('click', function() {
            video.play().then(() => {
                video.pause();
            });
        }, { once: true });
    </script>
</body>
</html>
