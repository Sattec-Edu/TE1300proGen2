<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR - Final Version</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* تنسيق الزر ليكون في المنتصف تماماً */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            /* هذه الخاصية هي السر في التوسط الحقيقي */
            transform: translateX(-50%); 
            z-index: 1000;
            width: 80%; /* تحديد عرض لضمان التناسق */
            max-width: 300px;
            text-align: center;
        }

        #playBtn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: #1a73e8;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <a-marker preset="hiro">
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <a-video src="#vid" position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- الحاوية المتوسطة للزر -->
    <div class="controls">
        <button id="playBtn">تشغيل العرض التفاعلي ▶️</button>
    </div>

    <script>
        const btn = document.getElementById('playBtn');
        const video = document.getElementById('vid');
        
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btn.innerHTML = "إيقاف مؤقت ⏸️";
                btn.style.background = "#d93025";
            } else {
                video.pause();
                btn.innerHTML = "تشغيل العرض التفاعلي ▶️";
                btn.style.background = "#1a73e8";
            }
        });
    </script>
</body>
</html>
