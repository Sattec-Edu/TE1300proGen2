<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- هنا نشير لأسماء الملفات كما رفعتها بالضبط -->
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <!-- سيثبت العرض فوق علامة Hiro -->
        <a-marker preset="hiro">
            <!-- عرض الإطار -->
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <!-- عرض الفيديو فوقه -->
            <a-video src="#vid" position="0 0.02 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <div style="position:fixed; bottom:20px; width:100%; text-align:center; z-index:1000;">
        <button onclick="document.querySelector('#vid').play();" style="padding:15px 30px; background:#1a73e8; color:white; border:none; border-radius:10px; font-weight:bold;">
            اضغط لتشغيل الشاشة ▶️
        </button>
    </div>
</body>
</html>
