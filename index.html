<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR | Stable Solution</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* التوسط المطلق (Flexbox) لضمان المركزية */
        .full-center {
            position: fixed; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .header { top: 20px; }
        .footer { bottom: 0; background: rgba(0,0,0,0.8); padding: 15px 0; flex-direction: column; align-items: center; }
        .controls { bottom: 90px; pointer-events: auto; }

        .brand-card {
            background: white; padding: 10px 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); color: #1a73e8; font-weight: bold;
        }

        button {
            padding: 15px 30px; border-radius: 50px; border: none;
            color: white; font-weight: bold; cursor: pointer; margin: 0 5px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>
    <div class="full-center header"><div class="brand-card">SATTEC</div></div>

    <div class="full-center footer">
        <div style="color: white; font-size: 14px;">info@sattec.com | 920000000</div>
    </div>

    <div class="full-center controls">
        <button id="playBtn" style="background: #1a73e8;">تشغيل ▶️</button>
        <button id="muteBtn" style="background: #5f6368;">صوت 🔊</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frameImg" src="frame.png">
        </a-assets>

        <!-- استبدل الرابط أدناه بملف الباترن البسيط الجديد -->
        <a-marker type="pattern" url="pattern-qr-code (3).patt">
            <a-entity rotation="-90 0 0">
                <a-image src="#frameImg" width="2.4" height="1.4" position="0 0 0"></a-image>
                <a-plane material="src: #vid; shader: flat;" width="2.2" height="1.2" position="0 0 0.02"></a-plane>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('vid');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');

        // إجبار المتصفح على رسم الفيديو لضمان ظهوره
        function update() {
            if (!video.paused) {
                const mesh = document.querySelector('a-plane').getObject3D('mesh');
                if (mesh && mesh.material.map) mesh.material.map.needsUpdate = true;
            }
            requestAnimationFrame(update);
        }
        update();

        playBtn.addEventListener('click', () => {
            if (video.paused) { video.play(); playBtn.innerHTML = "إيقاف ⏸️"; playBtn.style.background = "#d93025"; }
            else { video.pause(); playBtn.innerHTML = "تشغيل ▶️"; playBtn.style.background = "#1a73e8"; }
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? "صوت 🔊" : "كتم 🔇";
            muteBtn.style.background = video.muted ? "#5f6368" : "#34a853";
        });
    </script>
</body>
</html>
