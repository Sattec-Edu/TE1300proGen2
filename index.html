<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR | Final Success</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .ui { position: fixed; left: 0; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none; }
        .header { top: 20px; }
        .controls { bottom: 60px; pointer-events: auto; }
        .tag { background: white; padding: 10px 25px; border-radius: 8px; color: #1a73e8; font-weight: bold; }
        button { padding: 15px 30px; border-radius: 5px; border: none; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <div class="ui header"><div class="tag">SATTEC</div></div>
    <div class="ui controls"><button id="go">بدء العرض الآن 🎬</button></div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; antialias: true;">
        <a-assets>
            <!-- إضافة autoplay و muted و playsinline بشكل قسري -->
            <video id="videoAsset" src="screen_video.mp4" 
                   autoplay loop="true" crossorigin="anonymous" 
                   playsinline webkit-playsinline muted preload="auto"></video>
            <img id="frameAsset" src="frame.png">
        </a-assets>

        <a-marker type="pattern" url="sattec-logo.patt">
            <a-entity rotation="-90 0 0">
                <a-image src="#frameAsset" width="2.4" height="1.4"></a-image>
                <!-- استخدام shader: flat ضروري جداً لتجنب الدائرة اللودينج -->
                <a-plane id="videoPlane" material="src: #videoAsset; shader: flat; side: double; transparent: true; opacity: 1;" 
                         width="2.2" height="1.2" position="0 0 0.05"></a-plane>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const v = document.querySelector('#videoAsset');
        const btn = document.querySelector('#go');
        const plane = document.querySelector('#videoPlane');

        btn.addEventListener('click', () => {
            // فك كتم الصوت وتشغيل الفيديو برمجياً
            v.muted = false;
            v.play();
            btn.style.display = 'none';
            
            // "الوخزة البرمجية": إجبار الماتيريال على التحديث فور الضغط
            if(plane.getObject3D('mesh')) {
                plane.getObject3D('mesh').material.map.needsUpdate = true;
            }
        });

        // حلقة التحديث المستمر لضمان استمرار ظهور الفيديو
        function refreshVideo() {
            if (v.readyState >= v.HAVE_CURRENT_DATA) {
                const mesh = plane.getObject3D('mesh');
                if (mesh && mesh.material.map) {
                    mesh.material.map.needsUpdate = true;
                }
            }
            requestAnimationFrame(refreshVideo);
        }
        refreshVideo();
    </script>
</body>
</html>
