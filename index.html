<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR | Fixed Precision</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* التوسيط المطلق والنهائي */
        .flex-center {
            position: fixed; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .top-brand { top: 20px; }
        .bottom-info { 
            bottom: 0; background: rgba(0,0,0,0.85); 
            padding: 20px 0; flex-direction: column; align-items: center;
        }
        .btn-container { bottom: 100px; gap: 15px; pointer-events: auto; }

        .tag {
            background: white; padding: 10px 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; color: #1a73e8;
        }

        button {
            padding: 15px 30px; border-radius: 50px; border: none;
            color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); min-width: 120px;
        }
    </style>
</head>

<body>
    <div class="flex-center top-brand"><div class="tag">SATTEC</div></div>

    <div class="flex-center bottom-info">
        <div style="color: white; margin-bottom: 5px;">info@sattec.com</div>
        <div style="color: rgba(255,255,255,0.7); font-size: 14px;">الرقم الموحد: 920000000</div>
    </div>

    <div class="flex-center btn-container">
        <button id="playBtn" style="background: #1a73e8;">تشغيل ▶️</button>
        <button id="muteBtn" style="background: #5f6368;">صوت 🔊</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frameImg" src="frame.png">
        </a-assets>

        <!-- إضافة معامل التنعيم (Smoothing) العالي لامتصاص الحركة المجنونة -->
        <a-marker type="pattern" url="pattern-qr-code (3).patt" 
                  smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="10">
            
            <a-entity rotation="-90 0 0">
                <a-image src="#frameImg" width="2.4" height="1.4" position="0 0 0.01"></a-image>
                <!-- استخدام shader: flat مع تثبيت الـ Opacity لضمان الرندر -->
                <a-plane material="src: #vid; shader: flat; transparent: true; opacity: 1;" 
                         width="2.2" height="1.2" position="0 0 0.05"></a-plane>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('vid');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');

        // إجبار المتصفح على تحديث الصورة يدوياً لمنع مشكلة "الصوت فقط"
        function renderLoop() {
            if (!video.paused) {
                const plane = document.querySelector('a-plane');
                if (plane && plane.getObject3D('mesh')) {
                    const material = plane.getObject3D('mesh').material;
                    if (material.map) material.map.needsUpdate = true;
                }
            }
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = "إيقاف ⏸️";
                playBtn.style.background = "#d93025";
            } else {
                video.pause();
                playBtn.innerHTML = "تشغيل ▶️";
                playBtn.style.background = "#1a73e8";
            }
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.innerHTML = video.muted ? "صوت 🔊" : "كتم 🔇";
            muteBtn.style.background = video.muted ? "#5f6368" : "#34a853";
        });
    </script>
</body>
</html>
