<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SATTEC | شاشة تفاعلية</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* المعلومات - في المنتصف دائماً */
        .info {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-size: 14px;
            z-index: 100;
        }
        
        /* زر التحكم - في المنتصف */
        .btn-container {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 100;
        }
        
        button {
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            background: #1a73e8;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .title {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="title">SATTEC</div>
    <div class="info">info@sattec.com | 920000000</div>
    <div class="btn-container">
        <button id="playBtn">▶️ تشغيل</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <video id="screenVideo" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frameImg" src="frame.png">
            <audio id="voiceAudio" src="voiceover.mp3" preload="auto"></audio>
        </a-assets>

        <!-- استخدام المعرف الرقمي 5 (لا يحتاج ملف patt) -->
        <a-marker type="barcode" value="5" id="mainMarker">
            <a-entity rotation="-90 0 0">
                <a-image src="#frameImg" width="2.3" height="1.3" position="0 0 0"></a-image>
                <a-video src="#screenVideo" width="2.1" height="1.1" position="0 0 0.05"></a-video>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('screenVideo');
        const audio = document.getElementById('voiceAudio');
        const btn = document.getElementById('playBtn');
        const marker = document.getElementById('mainMarker');
        
        let videoPlaying = false;
        
        // زر التشغيل الموحد
        btn.addEventListener('click', () => {
            if (!videoPlaying) {
                video.play();
                audio.muted = false;
                audio.play();
                btn.innerHTML = "⏸️ إيقاف";
                btn.style.background = "#d93025";
                videoPlaying = true;
            } else {
                video.pause();
                audio.pause();
                btn.innerHTML = "▶️ تشغيل";
                btn.style.background = "#1a73e8";
                videoPlaying = false;
            }
        });
        
        // عند اكتشاف الباركود
        marker.addEventListener('markerFound', () => {
            console.log("✅ تم اكتشاف المعرف الرقمي 5");
        });
        
        // عند فقدان الباركود
        marker.addEventListener('markerLost', () => {
            console.log("❌ فقد المعرف الرقمي 5");
        });
        
        console.log("✅ المشروع جاهز - اطبع المعرف الرقمي 5 ووجه الكاميرا نحوه");
    </script>
</body>
</html>
