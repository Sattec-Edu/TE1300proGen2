<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SATTEC | تجربة تفاعلية</title>
    
    <!-- مكتبة MindAR و A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        .ui-overlay {
            position: fixed;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .header { top: 20px; }
        .footer { bottom: 0; background: rgba(0,0,0,0.85); padding: 15px 0; }
        .controls { bottom: 100px; pointer-events: auto; gap: 15px; flex-direction: row; justify-content: center; }
        
        .brand {
            background: white;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: bold;
            color: #1a73e8;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        button {
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            margin: 0 10px;
        }
        #playBtn { background: #1a73e8; color: white; }
        #muteBtn { background: #5f6368; color: white; }
        
        /* مؤشر للمستخدم */
        .instruction {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1001;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="ui-overlay header"><div class="brand">SATTEC</div></div>
    <div class="ui-overlay footer">
        <div style="color: white; font-size: 14px;">info@sattec.com | 920000000</div>
    </div>
    <div class="ui-overlay controls">
        <button id="playBtn">▶️ تشغيل</button>
        <button id="muteBtn">🔊 صوت</button>
    </div>
    
    <div id="instruction" class="instruction">🔍 وجه الكاميرا نحو الصورة المستهدفة</div>

    <!-- مشهد الواقع المعزز - باستخدام رابط يعمل -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <img id="animation" src="screen_animation.webp" crossorigin="anonymous">
            <img id="frameImage" src="frame.png" crossorigin="anonymous">
            <audio id="sound" src="voiceover.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
            <a-image src="#frameImage" width="2.4" height="1.4" position="0 0 0"></a-image>
            <a-plane material="src: #animation; shader: flat; transparent: true" 
                     width="2.2" height="1.2" 
                     position="0 0 0.05"
                     rotation="-90 0 0">
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        const videoAnim = document.getElementById('animation');
        const audio = document.getElementById('sound');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        const instruction = document.getElementById('instruction');
        let isPlaying = false;
        let targetFound = false;

        // مراقبة اكتشاف الهدف
        const targetEntity = document.getElementById('ar-target');
        
        if (targetEntity) {
            targetEntity.addEventListener('targetFound', () => {
                targetFound = true;
                instruction.style.display = 'none';
                console.log("✅ تم اكتشاف الهدف!");
                // تشغيل الصوت تلقائياً عند اكتشاف الهدف (إذا لم يكن مكتوماً)
                if (audio.muted === false) {
                    audio.play().catch(e => console.log("تفاعل المستخدم مطلوب للصوت"));
                }
            });
            
            targetEntity.addEventListener('targetLost', () => {
                targetFound = false;
                instruction.style.display = 'block';
                console.log("❌ فقد الهدف");
            });
        }

        // تشغيل/إيقاف الصورة المتحركة
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                playBtn.innerHTML = "⏸️ إيقاف";
                playBtn.style.background = "#d93025";
                // إعادة تحميل الصورة المتحركة
                videoAnim.style.animation = 'none';
                videoAnim.offsetHeight;
                videoAnim.style.animation = null;
            } else {
                isPlaying = false;
                playBtn.innerHTML = "▶️ تشغيل";
                playBtn.style.background = "#1a73e8";
            }
        });

        // كتم/تشغيل الصوت
        muteBtn.addEventListener('click', () => {
            if (audio.muted) {
                audio.muted = false;
                muteBtn.innerHTML = "🔇 كتم";
                muteBtn.style.background = "#5f6368";
                // محاولة تشغيل الصوت
                audio.play().catch(e => console.log("اضغط على الشاشة أولاً"));
            } else {
                audio.muted = true;
                muteBtn.innerHTML = "🔊 صوت";
                muteBtn.style.background = "#34a853";
                audio.pause();
            }
        });

        // تفعيل الصوت عند أول نقرة على الشاشة (تجاوز سياسة المتصفح)
        document.body.addEventListener('click', () => {
            if (audio.muted === false && targetFound) {
                audio.play().catch(e => console.log(""));
            }
        });
        
        // اختفاء رسالة التعليمات بعد 5 ثوانٍ
        setTimeout(() => {
            if (!targetFound) {
                instruction.style.opacity = '0.7';
            }
        }, 5000);
        
        console.log("✅ المشروع جاهز - انتظر اكتشاف الهدف");
    </script>
</body>
</html>
