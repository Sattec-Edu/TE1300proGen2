<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SATTEC | العرض التفاعلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            direction: rtl;
        }
        .brand {
            background: #1a73e8;
            color: white;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
        }
        .screen-frame {
            width: 100%;
            background: #000;
            padding: 20px;
        }
        .screen-frame img {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 15px;
        }
        .video-container {
            background: #000;
            padding: 0 20px 20px 20px;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            display: block;
            margin: 0 auto;
            background: #000;
        }
        .buttons {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-play { background: #1a73e8; color: white; }
        .btn-mute { background: #5f6368; color: white; }
        .btn-pdf { background: #34a853; color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        button:active { transform: scale(0.97); }
        .contact {
            background: #f8f9fa;
            padding: 15px;
            font-size: 13px;
            color: #333;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">SATTEC</div>
    
    <div class="screen-frame">
        <img src="frame.png" alt="إطار الشاشة">
    </div>
    
    <div class="video-container">
        <video id="mainVideo" src="screen_video.mp4" loop playsinline preload="auto">
            متصفحك لا يدعم تشغيل الفيديو
        </video>
    </div>
    
    <div class="buttons">
        <button id="playPauseBtn" class="btn-play">▶️ تشغيل الفيديو</button>
        <button id="muteBtn" class="btn-mute">🔊 كتم الصوت</button>
        <button id="pdfBtn" class="btn-pdf">📄 تحميل المواصفات التقنية (PDF)</button>
        <button id="whatsappBtn" class="btn-whatsapp">📞 تواصل مع المبيعات</button>
    </div>
    
    <div class="contact">
        📧 info@sattec.com | 📞 الرقم الموحد: 920000000
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    let isPlaying = false;
    
    playPauseBtn.addEventListener('click', () => {
        if (isPlaying) {
            video.pause();
            playPauseBtn.innerHTML = '▶️ تشغيل الفيديو';
            playPauseBtn.style.background = '#1a73e8';
        } else {
            video.play();
            playPauseBtn.innerHTML = '⏸️ إيقاف الفيديو';
            playPauseBtn.style.background = '#d93025';
        }
        isPlaying = !isPlaying;
    });
    
    muteBtn.addEventListener('click', () => {
        if (video.muted) {
            video.muted = false;
            muteBtn.innerHTML = '🔇 كتم الصوت';
            muteBtn.style.background = '#5f6368';
        } else {
            video.muted = true;
            muteBtn.innerHTML = '🔊 تشغيل الصوت';
            muteBtn.style.background = '#34a853';
        }
    });
    
    pdfBtn.addEventListener('click', () => {
        window.open('https://drive.google.com/uc?export=download&id=1JTGLbFJGl6ufil4V8fuHp3Cv9lNJR0Ix', '_blank');
    });
    
    whatsappBtn.addEventListener('click', () => {
        window.open('https://wa.me/966509818728?text=أهلاً%20أود%20الاستفسار%20عن%20الشاشات%20التفاعلية', '_blank');
    });
    
    video.muted = true;
    video.play().catch(e => console.log('انتظر تفاعل المستخدم'));
</script>

</body>
</html>
