<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AR Screen</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="vid" src="https://drive.google.com/uc?export=download&id=1jmR2NyNPdAfhiMNpLB92QJJy8l3lS4Ow" loop="true" crossorigin="anonymous"></video>
            <img id="frame" src="https://drive.google.com/uc?export=download&id=1TIpDe-sh__Thaj1Kx8qKPTSrG9TKT361">
        </a-assets>

        <a-marker preset="hiro">
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.5" height="1.5"></a-image>
            <a-video src="#vid" position="0 0.01 0" rotation="-90 0 0" width="2.3" height="1.3"></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <button onclick="document.querySelector('#vid').play()" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:15px; z-index:999; background:#1a73e8; color:white; border:none; border-radius:10px;">تشغيل الفيديو ▶️</button>
</body>
</html>
