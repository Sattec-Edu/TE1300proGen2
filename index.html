<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SATTEC | الواقع المعزز</title>
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        .info {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            font-size: 13px;
            z-index: 1000;
        }
        
        button {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 30px;
            border-radius: 40px;
            border: none;
            background: #1a73e8;
            color: white;
            font-weight: bold;
            font-size: 16px;
            z-index: 1000;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="status" id="status">🔍 انتظر التعرف على الهدف...</div>
    <div class="info">SATTEC | info@sattec.com | 920000000</div>
    <button id="controlBtn">🔊 تشغيل الصوت</button>

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
             vr-mode-ui="enabled: false">
        
        <a-assets>
            <video id="screenVideo" src="screen_video.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frameImg" src="frame.png" crossorigin="anonymous">
            <audio id="bgAudio" src="voiceover.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <!-- الإطار -->
            <a-image src="#frameImg" width="2.5" height="1.5" position="0 0 0"></a-image>
            <!-- الفيديو - لاحظ استخدام shader: flat و opacity: 1 -->
            <a-video src="#screenVideo" width="2.3" height="1.3" position="0 0 0.05" rotation="-90 0 0"
                     material="shader: flat; opacity: 1; side: double"
                     autoplay="false">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('screenVideo');
        const audio = document.getElementById('bgAudio');
        const btn = document.getElementById('controlBtn');
        const target = document.getElementById('target');
        const statusDiv = document.getElementById('status');
        
        let isPlaying = false;
        let targetDetected = false;
        
        // مراقبة اكتشاف الهدف
        target.addEventListener('targetFound', () => {
            targetDetected = true;
            statusDiv.innerHTML = '✅ تم التعرف على الهدف';
            statusDiv.style.color = '#0f0';
            
            // تشغيل الفيديو تلقائياً عند اكتشاف الهدف (إذا لم يتم تشغيله بعد)
            if (!isPlaying) {
                video.play().catch(e => console.log("اضغط الزر للتشغيل"));
                isPlaying = true;
            }
        });
        
        target.addEventListener('targetLost', () => {
            targetDetected = false;
            statusDiv.innerHTML = '🔍 الهدف مفقود - وجه الكاميرا مرة أخرى';
            statusDiv.style.color = '#ff0';
        });
        
        // زر التحكم الموحد (صوت + فيديو)
        btn.addEventListener('click', () => {
            // تشغيل/إيقاف الفيديو
            if (video.paused) {
                video.play();
                isPlaying = true;
            } else {
                video.pause();
                isPlaying = false;
            }
            
            // تشغيل/كتم الصوت
            if (audio.paused && !audio.muted) {
                audio.play();
                btn.innerHTML = "🔇 كتم الصوت";
                btn.style.background = "#d93025";
            } else if (!audio.muted) {
                audio.pause();
                btn.innerHTML = "🔊 تشغيل الصوت";
                btn.style.background = "#1a73e8";
            }
        });
        
        // تفعيل الصوت عند أول تفاعل
        document.body.addEventListener('click', () => {
            if (audio.paused && !audio.muted) {
                audio.play().catch(e => console.log(""));
            }
        }, { once: true });
        
        console.log("✅ المشروع جاهز - وجه الكاميرا نحو الهدف");
        console.log("ملف الفيديو:", video ? video.src : "غير موجود");
        console.log("ملف الإطار:", document.getElementById('frameImg') ? "موجود" : "غير موجود");
    </script>
</body>
</html>
