<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec Interactive System</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* الهوية البصرية - متوسطة في الأعلى */
        .header-brand {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .header-box {
            background: rgba(255, 255, 255, 0.9); padding: 10px 25px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold; color: #1a73e8; font-size: 20px;
        }

        /* تذييل الصفحة - متوسط تماماً */
        .footer-contact {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 15px 0; text-align: center; z-index: 2000;
            font-size: 13px; backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center;
        }

        /* زر التحكم - متوسط تماماً */
        .ui-container {
            position: fixed; bottom: 85px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2100;
        }

        #playBtn {
            padding: 15px 40px; border-radius: 50px; border: none;
            background: #1a73e8; color: white; font-weight: bold;
            font-size: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="header-brand">
        <div class="header-box">SATTEC</div>
    </div>

    <div class="footer-contact">
        <div>info@sattec.com</div>
        <div style="margin-top: 5px;">الرقم الموحد: 920000000</div>
    </div>

    <div class="ui-container">
        <button id="playBtn">تشغيل العرض التفاعلي ▶️</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;">
        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <a-marker type="pattern" url="pattern-qr-code (3).patt" id="mainMarker">
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <a-video src="#vid" position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('playBtn');
        const video = document.getElementById('vid');
        
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btn.innerHTML = "إيقاف مؤقت ⏸️";
                btn.style.background = "#d93025";
            } else {
                video.pause();
                btn.innerHTML = "تشغيل العرض التفاعلي ▶️";
                btn.style.background = "#1a73e8";
            }
        });
    </script>
</body>
</html>
