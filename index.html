<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display AR</title>
    <!-- مكتبات الواقع المعزز المستقرة -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- إعداد المشهد للتعرف على علامة Hiro -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        <a-assets>
            <!-- استدعاء ملفاتك المرفوعة مباشرة -->
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <!-- سيظهر المحتوى عند توجيه الكاميرا لعلامة Hiro -->
        <a-marker preset="hiro">
            <!-- عرض إطار الشاشة كقاعدة -->
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <!-- عرض الفيديو فوق الإطار بمليمترات لضمان عدم التداخل -->
            <a-video src="#vid" position="0 0.05 0" rotation="-90 0 0" width="2.2" height="1.2"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- واجهة التحكم للمستخدم -->
    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 1000;">
        <button id="playBtn" style="padding: 15px 35px; border-radius: 50px; border: none; background: #1a73e8; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer;">
            تشغيل العرض التفاعلي ▶️
        </button>
    </div>

    <script>
        // تفعيل الفيديو يدوياً لتجاوز قيود المتصفحات
        const btn = document.getElementById('playBtn');
        const video = document.getElementById('vid');
        
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btn.innerHTML = "إيقاف مؤقت ⏸️";
                btn.style.background = "#d93025";
            } else {
                video.pause();
                btn.innerHTML = "تشغيل العرض التفاعلي ▶️";
                btn.style.background = "#1a73e8";
            }
        });
    </script>
</body>
</html>
