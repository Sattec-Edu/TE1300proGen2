<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR Pro</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* التوسط المطلق */
        .header-brand {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .header-box {
            background: white; padding: 10px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; color: #1a73e8; font-size: 18px;
        }

        .footer-contact {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8); color: white;
            padding: 15px 0; text-align: center; z-index: 2000; font-size: 13px;
            display: flex; flex-direction: column; align-items: center;
        }

        .ui-controls {
            position: fixed; bottom: 85px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 15px; z-index: 2100;
        }

        button {
            padding: 12px 28px; border-radius: 50px; border: none;
            color: white; font-weight: bold; cursor: pointer; font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); min-width: 100px;
        }
        #playBtn { background: #1a73e8; }
        #muteBtn { background: #5f6368; }
    </style>
</head>

<body>
    <div class="header-brand"><div class="header-box">SATTEC</div></div>

    <div class="footer-contact">
        <div>info@sattec.com</div>
        <div style="margin-top: 5px;">الرقم الموحد: 920000000</div>
    </div>

    <div class="ui-controls">
        <button id="playBtn">تشغيل ▶️</button>
        <button id="muteBtn">صوت 🔊</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- أضفنا سطر الفيديو مع إعدادات تقنية لضمان الرندر -->
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <a-marker type="pattern" url="pattern-qr-code (3).patt">
            <!-- الإطار في الأسفل قليلاً -->
            <a-image src="#frame" position="0 0 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            
            <!-- الفيديو: استخدمنا مادة (Material) يدوية لضمان الربط بالصورة -->
            <a-entity 
                geometry="primitive: plane; width: 2.2; height: 1.2" 
                position="0 0.05 0" 
                rotation="-90 0 0"
                material="src: #vid; shader: flat; transparent: true; opacity: 1;">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('vid');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');

        // أهم خطوة: التأكد من أن الفيديو "جاهز" للرسم
        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = "إيقاف ⏸️";
                playBtn.style.background = "#d93025";
            } else {
                video.pause();
                playBtn.innerHTML = "تشغيل ▶️";
                playBtn.style.background = "#1a73e8";
            }
        });

        muteBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteBtn.innerHTML = "كتم 🔇";
                muteBtn.style.background = "#5f6368";
            } else {
                video.muted = true;
                muteBtn.innerHTML = "صوت 🔊";
                muteBtn.style.background = "#34a853";
            }
        });

        // حركة برمجية لضمان بدء الرندر
        window.addEventListener('touchstart', function() {
            video.load();
        }, {once: true});
    </script>
</body>
</html>
