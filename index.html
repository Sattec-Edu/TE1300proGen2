<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec Direct AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* نظام التوسط المطلق للهوية والأزرار */
        .centered-ui {
            position: fixed; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            z-index: 2000; pointer-events: none;
        }
        .header { top: 20px; }
        .footer { bottom: 0; background: rgba(0,0,0,0.85); padding: 20px 0; color: white; }
        .controls { bottom: 100px; pointer-events: auto; }
        .tag { background: white; padding: 10px 30px; border-radius: 12px; color: #1a73e8; font-weight: bold; }
        button { padding: 15px 35px; border-radius: 50px; border: none; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>

<body>
    <div class="centered-ui header"><div class="tag">SATTEC</div></div>
    <div class="centered-ui footer"><div>info@sattec.com.sa | 920008934</div></div>
    
    <div class="centered-ui controls">
        <!-- زر واحد فقط يظهر للعميل لفتح الصوت -->
        <button id="unmuteBtn" style="background: #1a73e8;">🔊 تشغيل الصوت</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <!-- المعرف الهجين (S + QR) -->
        <a-marker type="pattern" url="sattec-logo.patt" id="mainMarker">
            <a-entity rotation="-90 0 0">
                <a-image src="#frame" width="2.4" height="1.4" position="0 0 0.01"></a-image>
                <a-plane material="src: #vid; shader: flat;" width="2.2" height="1.2" position="0 0 0.04"></a-plane>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const v = document.getElementById('vid');
        const btn = document.getElementById('unmuteBtn');
        const marker = document.getElementById('mainMarker');

        // بمجرد رصد الباركود الهجين، يبدأ الفيديو فوراً صامتاً (تجاوز حظر المتصفح)
        marker.addEventListener('markerFound', () => {
            v.play(); 
        });

        // العميل يضغط فقط ليسمع الصوت
        btn.onclick = () => {
            v.muted = false;
            btn.style.display = 'none'; // تختفي الأزرار ويبقى الفيديو
        };

        function update() {
            if (!v.paused) {
                const mesh = document.querySelector('a-plane').getObject3D('mesh');
                if (mesh && mesh.material.map) mesh.material.map.needsUpdate = true;
            }
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
