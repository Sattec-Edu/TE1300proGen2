<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sattec AR System</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* التوسط المطلق للهوية البصرية */
        .header-brand {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 2000;
        }
        .header-box {
            background: white; padding: 10px 25px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; color: #1a73e8; font-size: 20px;
        }

        /* تذييل الصفحة - متوسط تماماً */
        .footer-contact {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.85); color: white;
            padding: 15px 0; text-align: center; z-index: 2000; font-size: 14px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* حاوية الأزرار - متوسطة بدقة */
        .ui-controls {
            position: fixed; bottom: 95px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 15px; z-index: 2100;
        }

        button {
            padding: 12px 28px; border-radius: 50px; border: none;
            color: white; font-weight: bold; cursor: pointer; font-size: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); min-width: 110px;
        }
        #playBtn { background: #1a73e8; }
        #muteBtn { background: #5f6368; }
    </style>
</head>

<body>
    <div class="header-brand"><div class="header-box">SATTEC</div></div>

    <div class="footer-contact">
        <div>info@sattec.com</div>
        <div style="margin-top: 5px;">الرقم الموحد: 920000000</div>
    </div>

    <div class="ui-controls">
        <button id="playBtn">تشغيل ▶️</button>
        <button id="muteBtn">كتم 🔇</button>
    </div>

    <!-- إعدادات المشهد لضمان رندر الفيديو -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        <a-assets>
            <video id="vid" src="screen_video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <img id="frame" src="frame.png">
        </a-assets>

        <!-- الربط مع الباركود المخصص لك -->
        <a-marker type="pattern" url="pattern-qr-code (3).patt" id="mainMarker">
            <!-- الإطار -->
            <a-image src="#frame" position="0 0.01 0" rotation="-90 0 0" width="2.4" height="1.4"></a-image>
            <!-- الفيديو: أضفنا shader: flat لضمان الظهور بدون تأثير الإضاءة -->
            <a-video src="#vid" position="0 0.1 0" rotation="-90 0 0" width="2.2" height="1.2" material="shader: flat;"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('vid');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');

        // إصلاح مشكلة عدم ظهور الفيديو برمجياً
        window.addEventListener('click', () => {
            // التفاعل الأول للمستخدم يضمن تحميل الموارد
            video.load();
        }, { once: true });

        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.innerHTML = "إيقاف ⏸️";
                playBtn.style.background = "#d93025";
            } else {
                video.pause();
                playBtn.innerHTML = "تشغيل ▶️";
                playBtn.style.background = "#1a73e8";
            }
        });

        muteBtn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                muteBtn.innerHTML = "صوت 🔊";
                muteBtn.style.background = "#34a853";
            } else {
                video.muted = true;
                muteBtn.innerHTML = "كتم 🔇";
                muteBtn.style.background = "#5f6368";
            }
        });
    </script>
</body>
</html>
