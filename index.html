<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SATTEC | تجربة تفاعلية</title>
    
    <!-- مكتبة MindAR و A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* واجهة المستخدم - متوسطة تماماً */
        .ui-overlay {
            position: fixed;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .header { top: 20px; }
        .footer { bottom: 0; background: rgba(0,0,0,0.85); padding: 15px 0; }
        .controls { bottom: 100px; pointer-events: auto; gap: 15px; flex-direction: row; justify-content: center; }
        
        .brand {
            background: white;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: bold;
            color: #1a73e8;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        button {
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            margin: 0 10px;
        }
        #playBtn { background: #1a73e8; color: white; }
        #muteBtn { background: #5f6368; color: white; }
    </style>
</head>
<body>

    <!-- الهوية البصرية -->
    <div class="ui-overlay header"><div class="brand">SATTEC</div></div>
    <div class="ui-overlay footer">
        <div style="color: white; font-size: 14px;">info@sattec.com | 920000000</div>
    </div>
    <div class="ui-overlay controls">
        <button id="playBtn">▶️ تشغيل</button>
        <button id="muteBtn">🔊 صوت</button>
    </div>

    <!-- مشهد الواقع المعزز باستخدام MindAR -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.0/examples/image-tracking/assets/card-example/card.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- استخدام WebP بدلاً من MP4 لتجنب دائرة التحميل -->
            <img id="animation" src="screen_animation.webp" crossorigin="anonymous">
            <img id="frameImage" src="frame.png" crossorigin="anonymous">
            <audio id="sound" src="voiceover.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- الهدف: يمكنك استبدال هذا بملف .mind الخاص بك مستقبلاً -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- إطار الشاشة -->
            <a-image src="#frameImage" width="2.4" height="1.4" position="0 0 0"></a-image>
            <!-- المحتوى المتحرك (WebP) -->
            <a-plane material="src: #animation; shader: flat; transparent: true" 
                     width="2.2" height="1.2" 
                     position="0 0 0.05"
                     rotation="-90 0 0">
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        const videoAnim = document.getElementById('animation');
        const audio = document.getElementById('sound');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        let isPlaying = false;

        // تشغيل/إيقاف WebP (الصورة المتحركة)
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                // إعادة تعيين الصورة المتحركة (إجبارها على البدء)
                videoAnim.style.animation = 'none';
                videoAnim.offsetHeight;
                videoAnim.style.animation = null;
                isPlaying = true;
                playBtn.innerHTML = "⏸️ إيقاف";
                playBtn.style.background = "#d93025";
            } else {
                isPlaying = false;
                playBtn.innerHTML = "▶️ تشغيل";
                playBtn.style.background = "#1a73e8";
            }
        });

        // كتم/تشغيل الصوت
        muteBtn.addEventListener('click', () => {
            if (audio.muted) {
                audio.muted = false;
                muteBtn.innerHTML = "🔇 كتم";
                muteBtn.style.background = "#5f6368";
            } else {
                audio.muted = true;
                muteBtn.innerHTML = "🔊 صوت";
                muteBtn.style.background = "#34a853";
            }
        });

        // تشغيل الصوت عند بدء التفاعل (لتجاوز حظر المتصفح)
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(e => console.log("انتظر تفاعل المستخدم"));
            }
        }, { once: true });
        
        console.log("✅ المشروع جاهز - استخدم الهدف التجريبي (بطاقة MindAR) أو استبدل الهدف لاحقاً");
    </script>
</body>
</html>
